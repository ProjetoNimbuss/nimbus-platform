name: Deploy para Produção

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Atualizar aplicação e containers na VM
        run: |
          cd /home/debian/nimbus-platform
          git fetch origin main
          git reset --hard origin/main
          docker-compose up -d --build
          task flow:deploy

      # Remove o cache de build do Docker para evitar que o disco da VM (20 GB) lote.
      # Roda mesmo se o deploy falhar, já que disco cheio é uma causa comum de falha no build.
      - name: Limpar cache de build do Docker
        if: always()
        run: |
          docker builder prune -af
          df -h /
