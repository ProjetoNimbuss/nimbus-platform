name: Deploy para Produção

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Atualizar aplicação e containers na VM
        run: |
          cd /home/debian/nimbus-platform
          git fetch origin main
          git reset --hard origin/main
          docker-compose up -d --build
          task flow:deploy
