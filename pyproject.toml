[project]
name = "nimbus-pipelines"
version = "0.1.0"
description = "Pipelines de ingestão e orquestração (Prefect) de dados hidrometeorológicos do Nimbus"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "selenium>=4.20",
    "beautifulsoup4>=4.12",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "lxml>=5.0",
    "python-dotenv>=1.0.0",
    "prefect>=3.0.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-bigquery>=3.17.0",
    "gcsfs>=2024.2.0",
]

[tool.ruff]
line-length = 100
exclude = [
    ".git",
    "venv",
    ".env",
    "transform",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
