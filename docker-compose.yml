version: '3.8'

services:
  api:
    build:
      context: ./api
      target: development
    container_name: nimbus_api
    volumes:
      - ./api:/var/www/html
    working_dir: /var/www/html
    command: >
      sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local

  web:
    image: node:20-alpine
    container_name: nimbus_web
    volumes:
      - ./web:/app
      - nimbus_node_modules:/app/node_modules
      - nimbus_next_build:/app/.next
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "8080:3000"  # Mapeia a porta 8080 (localhost:8080) para a 3000 do Next.js
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000 # Frontend rodando no navegador vai acessar o localhost:8000
    depends_on:
      - api

  postgre:
    image: postgres:18-alpine3.23
    environment:
      POSTGRES_DB: nimbus_app
      POSTGRES_USER: nimbus_adm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: nimbus_prefect_server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    restart: unless-stopped

  prefect-worker:
    build:
      context: .
      dockerfile: pipelines/flows/Dockerfile.prefect
    container_name: nimbus_prefect_worker
    command: prefect worker start --pool default-agent-pool
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-sa-key.json
      - TOMORROW_IO_API_KEY=${TOMORROW_IO_API_KEY}
    depends_on:
      - prefect-server
    volumes:
      - .:/app
    restart: unless-stopped


volumes:
  nimbus_node_modules:
  nimbus_next_build:
  pgdata:
    driver: local

