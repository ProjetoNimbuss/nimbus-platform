version: '3.8'

services:
  api:
    build:
      context: ./api
      target: development
    container_name: nimbus_api
    volumes:
      - ./api:/var/www/html
    working_dir: /var/www/html
    command: >
      sh -c "composer install --no-interaction &&
             ([ -f .env ] || (cp .env.example .env && php artisan key:generate)) &&
             php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local

  web:
    image: node:20-alpine
    container_name: nimbus_web
    volumes:
      - ./web:/app
      - nimbus_node_modules:/app/node_modules
      - nimbus_next_build:/app/.next
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "8080:3000"  # Mapeia a porta 8080 (localhost:8080) para a 3000 do Next.js
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000 # Frontend rodando no navegador vai acessar o localhost:8000
    depends_on:
      - api

  postgre:
    image: postgres:18-alpine3.23
    environment:
      POSTGRES_DB: nimbus_app
      POSTGRES_USER: nimbus_adm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: nimbus_prefect_server
    command: prefect server start --host 0.0.0.0
    environment:
      - PREFECT_SERVER_UI_API_URL=${PREFECT_SERVER_UI_API_URL:-http://100.82.176.36:4200/api}
      - PREFECT_UI_API_URL=${PREFECT_SERVER_UI_API_URL:-http://100.82.176.36:4200/api}
    ports:
      - "4200:4200"
    restart: unless-stopped

  prefect-worker:
    build:
      context: .
      dockerfile: pipelines/flows/Dockerfile.prefect
    container_name: nimbus_prefect_worker
    command: prefect worker start --pool default-agent-pool
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-sa-key.json
      - TOMORROW_IO_API_KEY=${TOMORROW_IO_API_KEY}
    depends_on:
      - prefect-server
    volumes:
      - .:/app
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: nimbus_node_exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: nimbus_cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8085:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nimbus_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: nimbus_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  nimbus_node_modules:
  nimbus_next_build:
  pgdata:
    driver: local
  prometheus_data:
  grafana_data:


