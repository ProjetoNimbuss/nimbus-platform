version: '3.8'

services:
  api:
    image: python:3.11-slim # essa imagem ta python, tem que mudar para php
    container_name: nimbus_api
    volumes:
      - .:/app
    working_dir: /app/api
    command: >
      bash -c "apt-get update && apt-get install -y gcc && pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  web:
    image: node:20-alpine
    container_name: nimbus_web
    volumes:
      - ./web:/app
      - nimbus_node_modules:/app/node_modules
      - nimbus_next_build:/app/.next
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "8080:3000"  # Mapeia a porta 8080 (localhost:8080) para a 3000 do Next.js
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000 # Frontend rodando no navegador vai acessar o localhost:8000
    depends_on:
      - api

  minio:
    image: minio/minio:latest
    container_name: nimbus_minio
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Console Web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  postgre:
    image: postgres:18-alpine3.23
    environment:
      POSTGRES_DB: nimbus_app
      POSTGRES_USER: nimbus_adm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: nimbus_prefect_server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    restart: unless-stopped

  prefect-worker:
    build:
      context: .
      dockerfile: flows/Dockerfile.prefect
    container_name: nimbus_prefect_worker
    command: prefect worker start --pool default-agent-pool
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
    depends_on:
      - prefect-server
      - minio
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  nimbus_node_modules:
  nimbus_next_build:
  minio_data:
  pgdata:
    driver: local

